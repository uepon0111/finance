name: Update TQQQ analysis and deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Generated market JSON commits should not trigger a redundant second run.
    paths-ignore:
      - 'site/data/**'
  schedule:
    # 23:17 UTC is 08:17 JST the next day; runs after the US regular session close.
    - cron: '17 23 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tqqq-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Update market data, statistics, context and AI assessment
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DRIVE_ACCOUNTS_JSON: ${{ secrets.DRIVE_ACCOUNTS_JSON }}
        run: python pipeline/collect.py

      - name: Commit generated public analysis data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json site/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update TQQQ analysis"
            git push
          else
            echo "No generated data changes to commit."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
